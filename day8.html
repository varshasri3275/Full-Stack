<!DOCTYPE html>
<html>
    <head>
        <title>Video Audio and iframe tags </title>
    </head>
    <body>

        <!-- Video -->
        <h6>Here is your video to be displayed on UI</h6>
        <!-- mp4->Audio, .ogg->Both audio and video -->
         <!-- <video id="localvideo" autoplay loop width="320" height="240"> -->
         <video autoplay loop width="320" height="240">
            <source src="Blue Tech Modern Countdown Video.mp4" type="video/mp4" />
            <!-- <source src="" type="video/mp4" /> -->
         </video>
         <!-- document.getElementById('localvideo').currentTime=20 -->
        
        <video controls loop width="320" height="240">
            <source src="Blue Tech Modern Countdown Video.mp4" type="video/mp4" />
            <!-- <source src="" type="video/mp4" /> -->
         </video>

        <!-- Audio -->
        <audio controls autoplay loop >
            <source src="" type="audio/ogg"/>
        </audio>
          
        <iframe width="560" height="315" src="https://www.youtube.com/embed/0qt_vgeD6Io?si=Angvb05la77ufLtA" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </body>
</html>
